name: Release APK

# Only trusted pushes and manual runs may access signing secrets.
# Never add pull_request triggers to this workflow.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing release signing secrets. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD."
            exit 1
          fi

      - name: Restore local signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p PureTVMobileHelper/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > PureTVMobileHelper/signing/puretv-release.jks
          {
            echo "storeFile=../signing/puretv-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > PureTVMobileHelper/signing/signing.properties

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" >/dev/null
          "$SDKMANAGER" --install "build-tools;37.0.0" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;36.0.0" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.1" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" | grep -q '^android-37' || {
            echo "::error::Android SDK platform 37 is unavailable on this runner."
            exit 1
          }

      - name: Test and build signed release
        working-directory: PureTVMobileHelper
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PappVersionCode=${{ github.run_number }}

      - name: Verify and read release metadata
        id: meta
        working-directory: PureTVMobileHelper
        run: |
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_name=$(jq -r '.elements[0].versionName' "$metadata")
          version_code=$(jq -r '.elements[0].versionCode' "$metadata")
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=PureTV Mobile Helper"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v${version_name}-b${version_code}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PureTV ${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version_code }})
          files: PureTVMobileHelper/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
